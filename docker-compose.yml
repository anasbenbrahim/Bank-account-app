services:
  ebank-discovery-service:
    build: ./discovery-service
    container_name: ebank-discovery-service
    ports:
      - "8761:8761"
    expose:
      - '8761'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      retries: 4
      timeout: 5s
      start_period: 30s

  ebank-config-service:
    build: ./config-service
    container_name: ebank-config-service
    ports:
      - "9999:9999"
    expose:
      - '9999'
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discovery-service:8761/eureka
    depends_on:
      ebank-discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/actuator/health"]
      interval: 10s
      retries: 4
      timeout: 5s
      start_period: 30s

  ebank-customer-service:
    build: ./customer-service
    container_name: ebank-customer-service
    ports:
      - "3000:3000"
    expose:
      - '3000'
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://ebank-config-service:9999
    depends_on:
      ebank-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
      interval: 10s
      retries: 4
      timeout: 5s
      start_period: 30s

  ebank-account-service:
    build: ./account-service
    container_name: ebank-account-service
    ports:
      - "3001:3001"
    expose:
      - '3001'
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://ebank-config-service:9999
    depends_on:
      ebank-customer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/actuator/health"]
      interval: 10s
      retries: 4
      timeout: 5s
      start_period: 30s

  ebank-gateway-service:
    build: ./gateway-service
    container_name: ebank-gateway-service
    ports:
      - "8888:8888"
    expose:
      - '8888'
    environment:
      - DISCOVERY_SERVICE_URL=http://ebank-discovery-service:8761/eureka
      - CONFIG_SERVICE_URL=http://ebank-config-service:9999
    depends_on:
      ebank-config-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      retries: 4
      timeout: 5s
      start_period: 30s

networks:
  default:
    name: ebank-app